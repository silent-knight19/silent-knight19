<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" fill="none" role="img" aria-label="Sachin Kumar Singh, backend and systems engineer">
  <defs>
    <linearGradient id="bgh" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0D1117"/><stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <radialGradient id="haloh" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#F0883E" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#F0883E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomh" cx="0.5" cy="0.5" r="0.5">
